apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: siwarsrairi/discovery-server:1.0
          imagePullPolicy: Always
          ports:
            - name: eureka
              containerPort: 8761
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8761
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: food-delivery
spec:
  selector:
    app: discovery-server
  ports:
    - name: eureka
      port: 8761
      targetPort: 8761
  type: ClusterIP
