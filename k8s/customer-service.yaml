apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: food-delivery
  labels:
    app: customer-service
    monitoring: enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        monitoring: enabled
        app: customer-service
    spec:
      hostAliases:
        - ip: "192.168.58.1"
          hostnames:
            - "host.minikube.internal"
      containers:
        - name: customer-service
          image: siwarsrairi/customer-service:prom-metrics-v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
            - name: management
              containerPort: 9092
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: POSTGRES_USER
              value: fdp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "700m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9092
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9092
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9092
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: food-delivery
  labels:
    app: customer-service
    monitoring: enabled
spec:
  selector:
    app: customer-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service-metrics
  namespace: food-delivery
  labels:
    app: customer-service
    monitoring: enabled
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - name: management
      port: 9092
      targetPort: 9092
      protocol: TCP
