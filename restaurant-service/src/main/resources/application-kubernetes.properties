spring.application.name=restaurant-service
server.port=8082

spring.datasource.url=jdbc:postgresql://host.minikube.internal:5433/restaurant_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

fdp.security.jwk-set-uri=http://host.minikube.internal:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME}

spring.data.redis.host=host.minikube.internal
spring.data.redis.port=${REDIS_PORT:6381}
spring.data.redis.password=${REDIS_PASSWORD:fdp}

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://host.minikube.internal:9411/api/v2/spans

management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG

info.app.name=${spring.application.name}
info.app.description=FDP restaurants, menus, and menu items
