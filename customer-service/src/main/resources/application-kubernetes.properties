spring.application.name=customer-service
server.port=8081

spring.datasource.url=jdbc:postgresql://host.minikube.internal:5433/customer_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

fdp.security.jwk-set-uri=http://host.minikube.internal:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME}

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://host.minikube.internal:9411/api/v2/spans

logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=health,circuitbreakers,info,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=FDP customer profiles and delivery addresses
